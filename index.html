<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0c1024">
  <title>Hangman</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hangman">
  <!-- When styles.css, words.js or game.js changes, change the ?v= tag on all three so browsers fetch the new copies. -->
  <link rel="stylesheet" href="styles.css?v=2026-11-16c">
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>

  <!-- ============ SETTINGS SCREEN ============ -->
  <main id="setup" class="screen active">
    <div class="setup-scroll">
      <header class="hero">
        <div class="logo" aria-hidden="true">
          <span class="tile-mini t1">H</span>
          <span class="tile-mini t2">A</span>
          <span class="tile-mini t3">N</span>
          <span class="tile-mini t4">G</span>
        </div>
        <h1>Hangman</h1>
        <p>Guess the hidden word one letter at a time before you run out of chances.</p>
      </header>

      <section class="panel" aria-labelledby="h-players">
        <div class="panel-head">
          <h2 id="h-players">Players</h2>
          <span class="fixed-note">2 players</span>
        </div>
        <div class="seats" id="seats"></div>
        <p class="hint">Names are optional. Each player can be a Person or the Computer.</p>
      </section>

      <section class="panel" aria-labelledby="h-level">
        <div class="panel-head">
          <h2 id="h-level">Level</h2>
        </div>
        <div class="levels" id="levels" role="radiogroup" aria-label="Level"></div>
        <p class="hint">Each game has 5 words. Every word is new, and the player with the most points wins.</p>
      </section>
    </div>

    <footer class="setup-footer">
      <div class="summary" id="summary"></div>
      <button class="btn primary big" id="start-btn" type="button">Start game</button>
    </footer>
  </main>

  <!-- ============ PLAY SCREEN ============ -->
  <main id="game" class="screen">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">A</span><span class="brand-name">Hangman</span></div>
      <div class="round-info" id="round-info"></div>
      <div class="controls">
        <button class="icon-btn" id="sound-btn" type="button" aria-label="Sound on" title="Sound">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/><path class="mute" d="M17 9l5 6M22 9l-5 6"/></svg>
        </button>
        <button class="icon-btn" id="fs-btn" type="button" aria-label="Full screen" title="Full screen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
        </button>
        <button class="btn ghost" id="restart-btn" type="button" title="Restart">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4v5h5"/></svg><span>Restart</span>
        </button>
        <button class="btn ghost" id="menu-btn" type="button" title="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>Settings</span>
        </button>
      </div>
    </header>

    <section class="players" id="players" aria-label="Players"></section>

    <div class="status">
      <div class="status-main" id="status-main" role="status" aria-live="polite"></div>
    </div>

    <section class="table">
      <!-- One hangman per player, filled in by game.js -->
      <div class="gallows-row" id="gallows" aria-hidden="true"></div>

      <div class="side">
        <div class="hint-wrap" id="hint"></div>
        <div class="word" id="word" aria-label="The hidden word"></div>
        <div class="toast-slot"><div class="toast" id="toast" aria-live="polite"></div></div>
      </div>
    </section>

    <section class="keyboard" id="keys" aria-label="Letters"></section>
  </main>

  <div class="modal-layer" id="modal-layer" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <script src="words.js?v=2026-11-16c"></script>
  <script src="game.js?v=2026-11-16c"></script>
</body>
</html>
